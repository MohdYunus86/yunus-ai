<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yunus AI Pro</title><style>
:root{--accent:#14b8a6;--text:#ecfeff;--muted:#9ee5df}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top left,#164e63 0,#061b1a 42%,#03100f 100%);color:var(--text);height:100vh;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column;padding:14px}.hero{background:linear-gradient(135deg,rgba(20,184,166,.25),rgba(250,204,21,.08));border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:14px;display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center;font-size:32px;font-weight:900}.hero h1{margin:0;font-size:30px;letter-spacing:-.04em}.hero p{margin:2px 0 0;color:var(--muted);font-size:13px}.gear{margin-left:auto;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.1);color:white;border-radius:14px;padding:10px}.chat{flex:1;overflow:auto;padding:14px 0 95px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:13px 15px;border-radius:21px;line-height:1.5;white-space:pre-wrap;border:1px solid rgba(255,255,255,.08)}.user{align-self:flex-end;background:linear-gradient(135deg,#0f766e,#115e59);border-bottom-right-radius:6px}.ai{align-self:flex-start;background:rgba(16,63,59,.94);border-bottom-left-radius:6px}.meta{font-size:11px;color:rgba(236,254,255,.6);margin-bottom:4px;font-weight:800}.composer{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end;background:rgba(6,27,26,.92);border:1px solid rgba(255,255,255,.12);padding:9px;border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}textarea{flex:1;resize:none;max-height:130px;min-height:46px;border:0;outline:0;border-radius:16px;padding:13px;background:rgba(255,255,255,.08);color:var(--text);font:inherit}button{border:0;border-radius:16px;background:var(--accent);color:#042f2e;font-weight:900;padding:13px;min-height:46px}#clear{background:rgba(255,255,255,.12);color:var(--text);min-width:46px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);padding:24px;align-items:center;justify-content:center}.box{width:100%;max-width:460px;background:#0b2d2b;border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:18px}.box input{width:100%;border:0;border-radius:14px;padding:13px;margin:10px 0;background:rgba(255,255,255,.1);color:white}.row{display:flex;gap:8px}.row button{flex:1}.hint{color:var(--muted);font-size:13px;line-height:1.4}</style></head><body><main class="app"><section class="hero"><div class="logo">ي</div><div><h1>Yunus AI Pro</h1><p id="mode">Offline fallback</p></div><button id="settings" class="gear">⚙</button></section><section id="chat" class="chat"></section><form id="form" class="composer"><button type="button" id="clear">↺</button><textarea id="message" rows="1" placeholder="Tanya Yunus AI..."></textarea><button>Hantar</button></form></main><div id="modal" class="modal"><div class="box"><h2>Mode Pro Backend</h2><p class="hint">Untuk jadi bijak macam ChatGPT, sambungkan APK ini ke backend Yunus AI yang ada OPENAI_API_KEY.</p><input id="backend" placeholder="Backend URL, contoh https://api.example.com"><div class="row"><button id="saveUrl">Simpan</button><button id="close" style="background:#334155;color:white">Tutup</button></div><p class="hint">Kosongkan URL untuk guna offline fallback.</p></div></div><script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#message'),clearBtn=document.querySelector('#clear'),mode=document.querySelector('#mode'),modal=document.querySelector('#modal'),backendInput=document.querySelector('#backend');let history=JSON.parse(localStorage.getItem('yunus-pro-history')||'[]'),backend=localStorage.getItem('yunus-backend')||'';function save(){localStorage.setItem('yunus-pro-history',JSON.stringify(history.slice(-50)))}function setMode(){mode.textContent=backend?'Pro backend aktif':'Offline fallback'}function node(t,c,x){let n=document.createElement(t);n.className=c;n.textContent=x||'';return n}function add(r,t){let b=node('div','msg '+r,'');b.appendChild(node('div','meta',r==='user'?'Anda':'Yunus AI'));b.appendChild(document.createTextNode(t));chat.appendChild(b);chat.scrollTop=chat.scrollHeight}function render(){chat.innerHTML='';if(!history.length)add('ai','Assalamualaikum. Saya Yunus AI Pro. Untuk jawapan sepintar ChatGPT, tekan ⚙ dan sambungkan backend AI sebenar. Jika tidak, saya guna offline fallback asas.');history.forEach(m=>add(m.role,m.content))}function offline(m){m=(m||'').trim();let l=m.toLowerCase();if(/buat gambar|hasilkan gambar|generate image|lukis|draw|image/.test(l))return'Saya faham anda mahu jana gambar. Mode offline tidak boleh hasilkan imej sebenar. Prompt imej cadangan:\n\n“Ilustrasi moden '+(m.replace(/buat gambar|hasilkan gambar|generate image|lukis|draw|image/ig,'').trim()||'Yunus AI')+', gaya futuristik Melayu, warna teal dan emas, pencahayaan dramatik, sangat terperinci, resolusi tinggi.”\n\nUntuk gambar sebenar, sambungkan saya ke backend yang ada image API.';if(/hai|hello|salam|assalamualaikum/.test(l))return'Waalaikumussalam. Saya Yunus AI Pro. Untuk jawapan setaraf ChatGPT, aktifkan backend AI sebenar di butang ⚙.';if(/siapa awak|nama awak|yunus ai/.test(l))return'Saya Yunus AI Pro — APK dengan offline fallback dan boleh disambung ke backend LLM supaya jadi lebih bijak.';if(/ringkas|summary|rumus/.test(l)){let s=m.replace(/^(tolong|sila|boleh)?\s*(ringkas|summary|rumus|kesimpulan)/i,'').trim();return s.length>40?'Ringkasan: '+(s.match(/[^.!?]+[.!?]?/g)||[s]).slice(0,3).join(' '):'Tampal teks yang mahu diringkaskan.'}if(/code|coding|javascript|python|html|css|api|backend|frontend/.test(l))return'Boleh. Beritahu bahasa/program yang mahu dibuat. Mode offline boleh beri panduan asas; mode backend AI sebenar boleh tulis kod lengkap dan debug lebih baik.';return'Mode offline fallback: untuk jawapan bijak seperti ChatGPT, sila sambungkan backend AI sebenar melalui butang ⚙. Mesej anda: '+m}async function getReply(m){if(backend){try{let r=await fetch(backend.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history})});let j=await r.json();if(j.ok&&j.reply)return j.reply}catch(e){return'Backend Pro gagal disambung: '+e.message+'\n\nSaya guna jawapan offline sementara.\n\n'+offline(m)}}return offline(m)}form.addEventListener('submit',async e=>{e.preventDefault();let m=input.value.trim();if(!m)return;input.value='';history.push({role:'user',content:m});save();add('user',m);let wait=node('div','msg ai','');wait.appendChild(node('div','meta','Yunus AI'));wait.appendChild(document.createTextNode('Sedang berfikir...'));chat.appendChild(wait);chat.scrollTop=chat.scrollHeight;let r=await getReply(m);wait.remove();history.push({role:'ai',content:r});save();add('ai',r)});input.addEventListener('input',()=>{input.style.height='46px';input.style.height=Math.min(input.scrollHeight,130)+'px'});clearBtn.onclick=()=>{history=[];save();render()};document.querySelector('#settings').onclick=()=>{backendInput.value=backend;modal.style.display='flex'};document.querySelector('#close').onclick=()=>modal.style.display='none';document.querySelector('#saveUrl').onclick=()=>{backend=backendInput.value.trim();localStorage.setItem('yunus-backend',backend);setMode();modal.style.display='none';add('ai',backend?'Backend Pro disimpan. Saya akan cuba guna AI sebenar melalui URL itu.':'Backend dikosongkan. Mode offline fallback aktif.')};setMode();render();
</script></body></html>
