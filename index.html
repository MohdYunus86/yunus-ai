<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Yunus AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="brand">
        <div class="logo">ي</div>
        <div>
          <h1>Yunus AI</h1>
          <p>AI Melayu sebenar — frontend + backend runnable</p>
        </div>
      </div>
      <span id="status" class="status">Menyambung...</span>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <form id="form" class="composer">
      <button type="button" id="clear" title="Kosongkan chat">↺</button>
      <textarea id="message" rows="1" placeholder="Tanya Yunus AI dalam Bahasa Melayu..." required></textarea>
      <button type="submit">Hantar</button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
